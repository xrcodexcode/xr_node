<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#818CF8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34D399"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#F87171"/>
    </marker>
  </defs>

  <rect width="800" height="450" fill="url(#bg-grad)" rx="16"/>
  <rect x="20" y="20" width="760" height="410" fill="none" stroke="#334155" stroke-width="1" rx="12" stroke-dasharray="4 4"/>

  <!-- Header -->
  <text x="400" y="55" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="800" text-anchor="middle">ONE-SHOT AI vs. LOOP ENGINEERING</text>

  <!-- Left Box: One-Shot AI -->
  <g transform="translate(45, 85)" filter="url(#shadow)">
    <rect width="335" height="320" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <rect x="15" y="15" width="305" height="36" rx="8" fill="#7F1D1D" stroke="#EF4444" stroke-width="1"/>
    <text x="167" y="38" fill="#FCA5A5" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">⚡ One-Shot Prompting (Single Pass)</text>

    <!-- Flow -->
    <g transform="translate(100, 75)">
      <rect width="135" height="45" rx="8" fill="#0F172A" stroke="#475569" stroke-width="1"/>
      <text x="67" y="27" fill="#E2E8F0" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Prompt</text>
    </g>

    <path d="M 167 125 L 167 155" stroke="#F87171" stroke-width="2" marker-end="url(#arrow-red)"/>

    <g transform="translate(100, 160)">
      <rect width="135" height="45" rx="8" fill="#0F172A" stroke="#EF4444" stroke-width="1.5"/>
      <text x="67" y="27" fill="#FCA5A5" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Single Answer</text>
    </g>

    <!-- Outcome Note -->
    <rect x="25" y="235" width="285" height="60" rx="8" fill="#0F172A" stroke="#475569" stroke-width="1"/>
    <text x="167" y="258" fill="#F87171" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">⚠️ Hit or Miss</text>
    <text x="167" y="278" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" text-anchor="middle">No chance to fix mistakes or refine details</text>
  </g>

  <!-- Right Box: Loop Engineering -->
  <g transform="translate(420, 85)" filter="url(#shadow)">
    <rect width="335" height="320" rx="14" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
    <rect x="15" y="15" width="305" height="36" rx="8" fill="#065F46" stroke="#10B981" stroke-width="1"/>
    <text x="167" y="38" fill="#A7F3D0" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">🔄 Loop Engineering (Iterative)</text>

    <!-- Mini Loop Steps -->
    <g transform="translate(25, 75)">
      <rect width="70" height="36" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
      <text x="35" y="22" fill="#E2E8F0" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Prompt</text>

      <path d="M 72 18 L 93 18" stroke="#818CF8" stroke-width="1.5" marker-end="url(#arrow)"/>

      <rect x="95" y="0" width="85" height="36" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
      <text x="137" y="22" fill="#38BDF8" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Generate</text>

      <path d="M 182 18 L 203 18" stroke="#818CF8" stroke-width="1.5" marker-end="url(#arrow)"/>

      <rect x="205" y="0" width="80" height="36" rx="6" fill="#0F172A" stroke="#F59E0B" stroke-width="1"/>
      <text x="245" y="22" fill="#F59E0B" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Review</text>
    </g>

    <!-- Down & Loop Back Arrow -->
    <path d="M 270 115 L 270 140 L 70 140 L 70 160" fill="none" stroke="#A855F7" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

    <g transform="translate(25, 165)">
      <rect x="20" y="0" width="100" height="36" rx="6" fill="#0F172A" stroke="#A855F7" stroke-width="1"/>
      <text x="70" y="22" fill="#A855F7" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Improve</text>

      <path d="M 122 18 L 143 18" stroke="#818CF8" stroke-width="1.5" marker-end="url(#arrow)"/>

      <rect x="145" y="0" width="120" height="36" rx="6" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="1.5"/>
      <text x="205" y="22" fill="#34D399" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Final Answer</text>
    </g>

    <!-- Outcome Note -->
    <rect x="25" y="235" width="285" height="60" rx="8" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
    <text x="167" y="258" fill="#34D399" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">✨ Guaranteed High Quality</text>
    <text x="167" y="278" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" text-anchor="middle">Self-corrects until quality criteria are fully met</text>
  </g>
</svg>
