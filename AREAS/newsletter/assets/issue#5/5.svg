<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="core-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg-grad)" rx="16"/>
  <rect x="20" y="20" width="760" height="410" fill="none" stroke="#334155" stroke-width="1" rx="12" stroke-dasharray="4 4"/>

  <!-- Title Badge -->
  <rect x="260" y="30" width="280" height="32" rx="16" fill="#1E293B" stroke="#6366F1" stroke-width="1"/>
  <text x="400" y="51" fill="#818CF8" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">REAL-WORLD AGENT APPLICATIONS</text>

  <!-- Central Loop Engine -->
  <g transform="translate(325, 175)" filter="url(#shadow)">
    <rect width="150" height="100" rx="20" fill="url(#core-grad)"/>
    <text x="75" y="42" fill="#E0E7FF" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">CENTRAL</text>
    <text x="75" y="64" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="900" text-anchor="middle">LOOP ENGINE</text>
  </g>

  <!-- Connecting Lines -->
  <!-- Top Left: Coding Agent -->
  <path d="M 230 115 L 340 180" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4 4"/>
  <g transform="translate(70, 80)" filter="url(#shadow)">
    <rect width="170" height="60" rx="12" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
    <text x="85" y="28" fill="#38BDF8" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">💻 Coding Agent</text>
    <text x="85" y="45" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="500" text-anchor="middle">Write → Test → Fix Code</text>
  </g>

  <!-- Top Right: Writing Agent -->
  <path d="M 570 115 L 460 180" stroke="#EC4899" stroke-width="2" stroke-dasharray="4 4"/>
  <g transform="translate(560, 80)" filter="url(#shadow)">
    <rect width="170" height="60" rx="12" fill="#1E293B" stroke="#EC4899" stroke-width="2"/>
    <text x="85" y="28" fill="#F472B6" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">✍️ Writing Agent</text>
    <text x="85" y="45" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="500" text-anchor="middle">Draft → Critique → Edit</text>
  </g>

  <!-- Far Left Middle: Research Agent -->
  <path d="M 220 225 L 325 225" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4 4"/>
  <g transform="translate(50, 195)" filter="url(#shadow)">
    <rect width="170" height="60" rx="12" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
    <text x="85" y="28" fill="#FBBF24" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">🔍 Research Agent</text>
    <text x="85" y="45" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="500" text-anchor="middle">Search → Verify → Synthesize</text>
  </g>

  <!-- Far Right Middle: Data Analysis Agent -->
  <path d="M 580 225 L 475 225" stroke="#10B981" stroke-width="2" stroke-dasharray="4 4"/>
  <g transform="translate(580, 195)" filter="url(#shadow)">
    <rect width="170" height="60" rx="12" fill="#1E293B" stroke="#10B981" stroke-width="2"/>
    <text x="85" y="28" fill="#34D399" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">📊 Data Analysis Agent</text>
    <text x="85" y="45" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="500" text-anchor="middle">Query → Plot → Check Anomalies</text>
  </g>

  <!-- Bottom Center: Knowledge Base / RAG Agent -->
  <path d="M 400 320 L 400 275" stroke="#A855F7" stroke-width="2" stroke-dasharray="4 4"/>
  <g transform="translate(305, 320)" filter="url(#shadow)">
    <rect width="190" height="65" rx="12" fill="#1E293B" stroke="#A855F7" stroke-width="2"/>
    <text x="95" y="28" fill="#C084FC" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">🧠 Knowledge Graph &amp; RAG</text>
    <text x="95" y="47" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="500" text-anchor="middle">Extract → Dedupe → Link Graph</text>
  </g>
</svg>
