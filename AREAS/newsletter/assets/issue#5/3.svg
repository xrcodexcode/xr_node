<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#F59E0B"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#A855F7"/>
    </marker>
  </defs>

  <rect width="800" height="450" fill="url(#bg-grad)" rx="16"/>
  <rect x="20" y="20" width="760" height="410" fill="none" stroke="#334155" stroke-width="1" rx="12" stroke-dasharray="4 4"/>

  <!-- Title Badge -->
  <rect x="300" y="32" width="200" height="32" rx="16" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
  <text x="400" y="53" fill="#38BDF8" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">AI AGENT LOOP ARCHITECTURE</text>

  <!-- User Input Node (Far Left) -->
  <g transform="translate(50, 190)" filter="url(#shadow)">
    <rect width="100" height="70" rx="12" fill="#1E293B" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="50" y="33" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">INPUT</text>
    <text x="50" y="52" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">👤 User</text>
  </g>

  <!-- User -> Planner Link -->
  <path d="M 150 225 L 205 225" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow-amber)"/>

  <!-- Core Agent Loop Container -->
  <rect x="200" y="90" width="550" height="280" rx="16" fill="#0F172A" fill-opacity="0.6" stroke="#334155" stroke-width="1"/>
  <text x="475" y="115" fill="#64748B" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">AUTONOMOUS AGENT LOOP</text>

  <!-- Node 1: Planner -->
  <g transform="translate(225, 140)" filter="url(#shadow)">
    <rect width="115" height="75" rx="12" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
    <text x="57" y="32" fill="#F59E0B" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">1. BRAIN</text>
    <text x="57" y="52" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" text-anchor="middle">Planner</text>
  </g>

  <!-- Planner -> Executor -->
  <path d="M 340 177 L 390 177" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Node 2: Executor -->
  <g transform="translate(395, 140)" filter="url(#shadow)">
    <rect width="115" height="75" rx="12" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
    <text x="57" y="32" fill="#38BDF8" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">2. HANDS</text>
    <text x="57" y="52" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" text-anchor="middle">Executor</text>
  </g>

  <!-- Executor -> Reviewer -->
  <path d="M 510 177 L 560 177" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow-emerald)"/>

  <!-- Node 3: Reviewer -->
  <g transform="translate(565, 140)" filter="url(#shadow)">
    <rect width="115" height="75" rx="12" fill="#1E293B" stroke="#10B981" stroke-width="2"/>
    <text x="57" y="32" fill="#10B981" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">3. CRITIC</text>
    <text x="57" y="52" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" text-anchor="middle">Reviewer</text>
  </g>

  <!-- Reviewer -> Memory (Down) -->
  <path d="M 622 215 L 622 260 L 525 260" stroke="#10B981" stroke-width="2" marker-end="url(#arrow-purple)"/>

  <!-- Node 4: Memory -->
  <g transform="translate(395, 260)" filter="url(#shadow)">
    <rect width="120" height="70" rx="12" fill="#1E293B" stroke="#A855F7" stroke-width="2"/>
    <text x="60" y="30" fill="#A855F7" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">4. CONTEXT</text>
    <text x="60" y="49" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" text-anchor="middle">Memory</text>
  </g>

  <!-- Memory -> Planner (Loop back up left) -->
  <path d="M 395 295 L 282 295 L 282 225" stroke="#A855F7" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrow-amber)"/>

  <g transform="translate(338, 295)">
    <rect x="-45" y="-12" width="90" height="24" rx="12" fill="#0F172A" stroke="#A855F7" stroke-width="1"/>
    <text x="0" y="4" fill="#C084FC" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Feedback</text>
  </g>

  <text x="400" y="415" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" text-anchor="middle">Each loop cycle enriches memory and refines the next execution strategy.</text>
</svg>
