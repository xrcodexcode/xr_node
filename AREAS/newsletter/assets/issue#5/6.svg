<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#EF4444"/>
    </marker>
  </defs>

  <rect width="800" height="450" fill="url(#bg-grad)" rx="16"/>
  <rect x="20" y="20" width="760" height="410" fill="none" stroke="#334155" stroke-width="1" rx="12" stroke-dasharray="4 4"/>

  <!-- Title Badge -->
  <rect x="270" y="28" width="260" height="32" rx="16" fill="#1E293B" stroke="#EF4444" stroke-width="1"/>
  <text x="400" y="49" fill="#F87171" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">STOPPING CONDITIONS FOR LOOPS</text>

  <!-- 4 Decision Cards / Diamonds -->

  <!-- Condition 1: Quality Target Reached -->
  <g transform="translate(60, 95)" filter="url(#shadow)">
    <rect width="145" height="130" rx="14" fill="#1E293B" stroke="#10B981" stroke-width="2"/>
    <circle cx="72" cy="35" r="18" fill="#065F46" stroke="#10B981" stroke-width="1.5"/>
    <text x="72" y="40" fill="#34D399" font-family="Inter, system-ui, sans-serif" font-size="14" text-anchor="middle">🎯</text>
    <text x="72" y="75" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Quality Target</text>
    <text x="72" y="93" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Reached</text>
    <text x="72" y="113" fill="#34D399" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Score &gt; 95%</text>
  </g>

  <!-- Condition 2: Maximum Iterations -->
  <g transform="translate(235, 95)" filter="url(#shadow)">
    <rect width="145" height="130" rx="14" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
    <circle cx="72" cy="35" r="18" fill="#78350F" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="72" y="40" fill="#FBBF24" font-family="Inter, system-ui, sans-serif" font-size="14" text-anchor="middle">🔢</text>
    <text x="72" y="75" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Maximum</text>
    <text x="72" y="93" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Iterations</text>
    <text x="72" y="113" fill="#FBBF24" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Max N Loops</text>
  </g>

  <!-- Condition 3: No Further Improvement -->
  <g transform="translate(410, 95)" filter="url(#shadow)">
    <rect width="145" height="130" rx="14" fill="#1E293B" stroke="#A855F7" stroke-width="2"/>
    <circle cx="72" cy="35" r="18" fill="#581C87" stroke="#A855F7" stroke-width="1.5"/>
    <text x="72" y="40" fill="#C084FC" font-family="Inter, system-ui, sans-serif" font-size="14" text-anchor="middle">🛑</text>
    <text x="72" y="75" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">No Further</text>
    <text x="72" y="93" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Improvement</text>
    <text x="72" y="113" fill="#C084FC" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Delta &lt; Threshold</text>
  </g>

  <!-- Condition 4: Time Limit -->
  <g transform="translate(585, 95)" filter="url(#shadow)">
    <rect width="145" height="130" rx="14" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="72" cy="35" r="18" fill="#0C4A6E" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="72" y="40" fill="#38BDF8" font-family="Inter, system-ui, sans-serif" font-size="14" text-anchor="middle">⏳</text>
    <text x="72" y="75" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Time / Token</text>
    <text x="72" y="93" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Limit Exceeded</text>
    <text x="72" y="113" fill="#38BDF8" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Timeout Safety</text>
  </g>

  <!-- Flow to Central STOP -->
  <path d="M 132 225 L 132 275 L 340 275" stroke="#10B981" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 307 225 L 307 275 L 340 275" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 482 225 L 482 275 L 460 275" stroke="#A855F7" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 657 225 L 657 275 L 460 275" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Central STOP Node -->
  <g transform="translate(325, 305)" filter="url(#shadow)">
    <rect width="150" height="70" rx="16" fill="#7F1D1D" stroke="#EF4444" stroke-width="2"/>
    <text x="75" y="32" fill="#FCA5A5" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">ANY CONDITION MET</text>
    <text x="75" y="52" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="900" text-anchor="middle">🛑 STOP LOOP</text>
  </g>

  <text x="400" y="415" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" text-anchor="middle">Stopping conditions protect system resources and prevent infinite computational loops.</text>
</svg>
