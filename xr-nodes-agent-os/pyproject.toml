[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xr-nodes-agent-os"
version = "0.1.0"
description = "XR-NODES Agent OS — AI-native operating layer for personal knowledge management"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "aiosqlite>=0.20.0",
    "sqlalchemy[asyncio]>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "click>=8.0",
    "rich>=13.0",
    "tenacity>=8.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.5",
]
models = [
    "openai>=1.0",
    "anthropic>=0.30",
    "google-genai>=2.0",
]

[project.scripts]
xr = "cli.xr:cli"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["backend", "cli"]
